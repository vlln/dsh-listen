# Audio evaluation tree: evidence persona, read_image, compaction and listen only.
# No shell, installation or download tools. Load alongside the run's model configuration.
- insert:
    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: audio-evaluation
        selectedDefault: audio-evaluation
    - id: audio-evaluation-headless-preset
      name: ./headless-preset.mjs
    - id: preset-audio-evaluation
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: audio-evaluation
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are an Agent
              complete: true
              includeRuntimeContext: false
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: false
              readImage: true
              write: false
              edit: false
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
          - id: audio-listen
            name: dsh-listen
            config:
              scratch: !!js dshHomePath('data', 'dsh-listen-evaluation')

